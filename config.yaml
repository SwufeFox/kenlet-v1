# kenlet-v1 Configuration
# 环境变量可覆盖敏感字段，见 .env.example

# ===========================================================================
# 交易标的
# ===========================================================================
symbols:
  - BTC
  - ETH
  - SOL
  - XRP
  - BNB

timeframes:
  - 1h
  - 4h
  - 1d

ma_periods:
  - 20
  - 38
  - 60
  - 180
  - 540

# ===========================================================================
# Layer 1 — 策略参数
# ===========================================================================
strategy:
  ma_entry: 38
  ma_exit: 60
  ma_trend: 180
  min_cross_pct: 0.0
  regime_filter: true
  trend_filter: true
  num_entries: 1             # 分批建仓次数 (1 = 一次建仓; 风险预算按批次均分)

# ===========================================================================
# Layer 1/2 — 风控
# ===========================================================================
risk:
  atr_period: 14
  atr_sl_mult: 3.0          # 止损 = ATR × 该倍数 (绝不用绝对美元)
  atr_tp_mult: 6.0          # 止盈 = ATR × 该倍数
  risk_per_trade: 0.02      # 单笔风险占权益 2%
  max_positions: 3
  use_risk_sizing: true     # 仓位 = 允许亏损 / 止损偏差

# ===========================================================================
# Layer 2 — 组合层 (优胜劣汰)
# ===========================================================================
portfolio:
  max_total_risk: 0.10
  default_risk_per_trade: 0.02
  max_positions: 5
  ranking_metric: composite   # composite | momentum | profit
  prune_threshold: -0.5       # 排名分低于此值淘汰
  rotate_on_cap: true
  min_cash_ratio: 0.05
  # ── 指数算法 (QQQ/TWI/合成指数) 见下方 index: 段 ──


# ===========================================================================
# Layer 2 增强 — 指数算法 (QQQ/TWI/合成指数)
# ===========================================================================
index:
  use_index_gate: true         # 指数趋势门控 (risk_on 才开新仓)
  gate_risk_scale: 0.33       # risk_off 时风险预算乘数 (0=全禁, 0.33=1/3, 0.5=半仓)
  use_relative_strength: true  # 相对强弱参与持仓排名 (跑赢指数加分)
  use_vol_targeting: true      # 波动率目标仓位缩放
  name: MARKET                 # 或 QQQ / TWI (需在 macro/ 放对应 CSV)
  ma_period: 100               # 指数门控均线周期 (200-DMA 经典, 100 更灵敏)
  vol_target: 0.25             # 目标年化波动率
  vol_floor: 0.3               # 缩放系数下限
  vol_cap: 1.5                 # 缩放系数上限

# ===========================================================================
# Layer 3 — LLM Fund Manager (kenlet-v1-etf manager)
# ===========================================================================
llm:
  enabled: false
  check_interval: 50          # 每 N 根 bar 评估一次
  drawdown_trigger: 0.08      # 回撤超 8% 触发
  # API 通过环境变量配置:
  #   OPENAI_BASE_URL  (默认 https://api.deepseek.com)
  #   OPENAI_API_KEY
  #   OPENAI_MODEL     (默认 deepseek-chat)

# ===========================================================================
# 回测默认
# ===========================================================================
backtest:
  initial_capital: 10000.0
  position_size: 0.25

# ===========================================================================
# Binance
# ===========================================================================
binance:
  enableRateLimit: true
  options:
    defaultType: spot
  retry:
    max_retries: 3
    backoff_factor: 2.0

# ===========================================================================
# 日志
# ===========================================================================
logging:
  level: INFO
  file: logs/kenlet-v1.log
  max_bytes: 10485760
  backup_count: 5
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"

# 兼容旧配置
watchlist:
  symbols:
    - BTC
    - ETH
    - SOL

data:
  default_symbol: BTC/USDT
  default_timeframe: 1d
  default_limit: 500
